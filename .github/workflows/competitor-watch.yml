name: Competitor Watch

on:
  schedule:
    # Monday 8:00 am NZST. This becomes 9:00 am during daylight saving.
    - cron: "0 20 * * 0"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright playwright-stealth
          playwright install chromium

      - name: Capture competitor content
        run: python capture_competitors.py

      - name: Analyse with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyse_competitors.py

      - name: Prepare delivery package
        run: python prepare_delivery.py   

      - name: Send archive and digest to Power Automate
        env:
          FLOW_URL: ${{ secrets.DIGEST_FLOW_URL }}
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @delivery.json \
            "$FLOW_URL"
            
      - name: Upload delivery package
        uses: actions/upload-artifact@v4
        with:
          name: delivery-package
          path: delivery.json
          if-no-files-found: error
          
      - name: Upload observations
        uses: actions/upload-artifact@v4
        with:
          name: observations
          path: observations.json
          if-no-files-found: error

      - name: Upload capture screenshots
        uses: actions/upload-artifact@v4
        with:
          name: capture-screenshots
          path: screenshots/
          if-no-files-found: warn
